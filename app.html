<style>
/* =============================================================================
   app.html — Ally, the Alliance DAO phone app (v1, 2026-09-11) — SPEC-mobile-app.md
   A personal position companion: where do I stand · how am I trending · what
   should I do · what changed since I last looked. Built from scratch for the
   phone on the org products; no desktop DOM, no Tailwind.
   Design system: one accent (cyan), semantic greens/reds, big mono numerals,
   16px inputs (no iOS zoom), safe-area aware, sheets not pages for detail.
   ============================================================================= */
:root{--bg:#0a0b0f;--bg2:#0f1218;--card:#12161e;--card2:#181d27;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--tx:#eef0f3;--tx2:#c3c8d1;--mut:#8b93a1;--dim:#5d6470;--cy:#22d3ee;--cy2:#67e8f9;--gr:#34d399;--rd:#f87171;--am:#fbbf24;--or:#fb923c;--pu:#c084fc;--r:16px;--r2:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior-y:contain}
body{margin:0;font-family:Outfit,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.35;padding-bottom:calc(76px + env(safe-area-inset-bottom));max-width:100vw;overflow-x:hidden}
a{color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
button{font-family:inherit}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(10,11,15,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(.5em + env(safe-area-inset-top)) .9em .5em}
.top .r1{display:flex;align-items:center;gap:.6em}
.top .ttl{font-weight:800;font-size:1.25em;flex:1;letter-spacing:-.01em}
.top .sub{font-size:.78em;color:var(--mut);margin-top:-.1em}
.pill{display:inline-flex;align-items:center;gap:.35em;padding:.28em .6em;border-radius:9999px;font-size:.78em;font-weight:700;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx2);white-space:nowrap}
.pill.cy{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08);color:var(--cy2)}
.pill.gr{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:var(--gr)}
.pill.rd{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.1);color:var(--rd)}
.pill.am{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.1);color:var(--am)}
.pill.pu{border-color:rgba(192,132,252,.35);background:rgba(192,132,252,.12);color:var(--pu)}
.pill.mut{color:var(--mut)}
.ib{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--tx);border-radius:9999px;width:2.3em;height:2.3em;display:inline-flex;align-items:center;justify-content:center;font-size:.95em;cursor:pointer}
.chipw{display:inline-flex;align-items:center;gap:.4em;padding:.35em .7em;border-radius:9999px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.28);color:var(--cy2);font-size:.82em;font-weight:700;max-width:44vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
/* ---------- layout ---------- */
.view{display:none;padding:.7em .8em 0}.view.on{display:block}
h2{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:1.1em .2em .5em;font-weight:700;display:flex;align-items:center;gap:.5em}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85em .95em;margin-bottom:.6em;position:relative}
.card.tap{cursor:pointer}.card.tap:active{background:var(--card2)}
.hero{background:linear-gradient(160deg,#121a24 0%,#0f1218 60%);border:1px solid rgba(34,211,238,.18);border-radius:20px;padding:1em 1em .9em;margin-bottom:.7em}
.hero .lab{font-size:.78em;color:var(--mut);font-weight:600;letter-spacing:.02em}
.hero .big{font-size:2.15em;font-weight:800;letter-spacing:-.02em;font-family:"JetBrains Mono",monospace;line-height:1.1;margin:.08em 0 .15em}
.hero .row{display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.hero svg{display:block;width:100%;height:56px;margin-top:.5em}
.row{display:flex;align-items:center;gap:.65em}.row .l{flex:1;min-width:0}
.k{font-size:.78em;color:var(--mut)}.k2{font-size:.82em;color:var(--tx2)}
.v{font-size:1.2em;font-weight:800;font-family:"JetBrains Mono",monospace;letter-spacing:-.01em;white-space:nowrap}.v.sm{font-size:1em}.v.xs{font-size:.9em}
.d{font-size:.76em;font-weight:700;padding:.15em .5em;border-radius:9999px;white-space:nowrap;font-family:"JetBrains Mono",monospace}
.d.up{background:rgba(52,211,153,.12);color:var(--gr)}.d.dn{background:rgba(248,113,113,.12);color:var(--rd)}.d.fl{background:rgba(255,255,255,.06);color:var(--mut);font-family:inherit}.d.new{background:rgba(192,132,252,.15);color:var(--pu);font-family:inherit}

.ic.cy{background:rgba(34,211,238,.12);color:var(--cy2)}.ic.gr{background:rgba(52,211,153,.12);color:var(--gr)}.ic.am{background:rgba(251,191,36,.12);color:var(--am)}.ic.pu{background:rgba(192,132,252,.14);color:var(--pu)}.ic.or{background:rgba(251,146,60,.12);color:var(--or)}.ic.rd{background:rgba(248,113,113,.12);color:var(--rd)}
.sub{font-size:.78em;color:var(--dim);margin-top:.2em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.55em}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5em}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:.7em .8em;min-width:0}

.li .r{text-align:right;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.92em;white-space:nowrap}.li .r .s{font-weight:500;font-family:Outfit,sans-serif}

.seg button.on{background:rgba(34,211,238,.15);color:var(--cy2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.65em .95em;border-radius:.8em;border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.1);color:var(--cy2);font-weight:700;font-size:.9em;text-decoration:none;cursor:pointer}
.btn.g{border-color:var(--line2);background:rgba(255,255,255,.05);color:var(--tx)}.btn.p{background:var(--cy);color:#04141a;border-color:var(--cy)}.btn.w{width:100%}
.btns{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.7em}
.empty{padding:1.3em .8em;text-align:center;color:var(--dim);font-size:.9em}.empty i{display:block;font-size:1.6em;margin-bottom:.35em;color:var(--mut)}
.alloc{display:flex;height:.55em;border-radius:9999px;overflow:hidden;background:rgba(255,255,255,.06);margin:.55em 0 .45em}
.alloc i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:.4em .9em;font-size:.74em;color:var(--mut)}.legend b{display:inline-block;width:.6em;height:.6em;border-radius:2px;margin-right:.35em;vertical-align:-.02em}
.bar{height:.5em;border-radius:9999px;background:rgba(255,255,255,.08);overflow:hidden;margin:.35em 0;display:flex}.bar i{display:block;height:100%}
input.in{width:100%;font-family:inherit;font-size:16px;color:#fff;background:var(--card2);border:1px solid var(--line2);border-radius:.75em;padding:.65em .85em;outline:0}
.res{max-height:44vh;overflow:auto;margin-top:.45em}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.th{background:var(--card2);border-radius:.8em;overflow:hidden;position:relative}.th img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#1f2430}
.th .p{position:absolute;left:0;right:0;bottom:0;padding:.35em .45em;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.8em;color:#fff;display:flex;justify-content:space-between}
.th .p span{font-family:Outfit,sans-serif;font-weight:600;color:#cbd5e1;font-size:.9em}
/* skeleton */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 37%,rgba(255,255,255,.05) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:.6em;height:1em}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skc{height:5.2em;margin-bottom:.6em;border-radius:var(--r)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,11,15,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(34,211,238,.16);padding:.3em .25em calc(.3em + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:.22em;padding:.35em .2em;color:var(--mut);font-size:.66em;font-weight:700;border:0;background:transparent;position:relative;min-height:48px;border-radius:.6em;cursor:pointer}
.tab i{font-size:1.75em;color:#6b7280;transition:transform .12s}.tab.on{color:var(--cy)}.tab.on i{color:var(--cy)}.tab:active i{transform:scale(.92)}
.tab b.n{position:absolute;top:0;right:calc(50% - 1.7em);min-width:1.45em;height:1.45em;border-radius:9999px;background:#ef4444;color:#fff;font-size:.62em;line-height:1.45em;text-align:center;padding:0 .3em;box-shadow:0 0 0 2px var(--bg)}
/* sheet + toast + onboarding + ptr */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}.sheet.on{display:flex}
.sheet .sc{width:100%;max-width:560px;background:#0f1218;border:1px solid rgba(34,211,238,.22);border-radius:20px 20px 0 0;padding:.6em 1em calc(1em + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:2.6em;height:.3em;border-radius:9999px;background:rgba(255,255,255,.18);margin:0 auto .7em}
.sheet h3{margin:.1em 0 .6em;font-size:1.05em;display:flex;align-items:center;gap:.5em}.sheet h3 .x{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2937;color:#fff;padding:.5em 1em;border-radius:9999px;font-size:.85em;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1}
.ob{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(1.2em + env(safe-area-inset-top)) 1.2em calc(140px + env(safe-area-inset-bottom))}.ob.on{display:block}
.ob .st{display:none}.ob .st.on{display:block}.ob .act{margin-top:1.2em}
.ob h1{font-size:1.7em;font-weight:800;letter-spacing:-.02em;margin:.4em 0 .2em}.ob p{color:var(--mut);margin:.2em 0 .8em;line-height:1.5}
.ob .dots{display:flex;gap:.4em;justify-content:center;margin:.6em 0}.ob .dots i{width:.5em;height:.5em;border-radius:9999px;background:rgba(255,255,255,.15)}.ob .dots i.on{background:var(--cy)}
.ob .feat{display:flex;gap:.7em;align-items:flex-start;margin:.55em 0}.ob .feat .ic{margin-top:.1em}.ob .feat b{display:block}.ob .feat span{font-size:.85em;color:var(--mut)}
.chk{display:flex;align-items:center;gap:.6em;padding:.55em .2em;border-bottom:1px solid var(--line);font-size:.95em}.chk input{width:1.2em;height:1.2em}
.ptr{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top));text-align:center;color:var(--cy2);font-size:.8em;z-index:19;opacity:0;transition:opacity .15s;pointer-events:none}.ptr.on{opacity:1}
.dev{font-size:.7em;color:var(--dim);text-align:center;padding:1em 0 .4em}
.spark{stroke:var(--cy);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark.gr{stroke:var(--gr)}.spark.rd{stroke:var(--rd)}.spark.am{stroke:var(--am)}
.sparkfill{fill:url(#sf);opacity:.6}
.you{font-size:.72em;color:var(--pu);font-weight:700}
.day{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:.9em .2em .35em;font-weight:700}
.fl{display:flex;gap:.6em;align-items:flex-start;padding:.55em .65em;background:var(--card2);border-radius:.75em;margin-bottom:.35em}
.fl img{width:2.4em;height:2.4em;border-radius:.5em;object-fit:cover;background:#1f2430;flex:0 0 auto}
.fl .t{font-size:.9em;font-weight:600}.fl .s{font-size:.74em;color:var(--mut);margin-top:.1em}.fl .w{margin-left:auto;font-size:.72em;color:var(--dim);white-space:nowrap;padding-top:.15em}
.fl.me{border:1px solid rgba(192,132,252,.35)}
.marker{display:flex;align-items:center;gap:.6em;color:var(--pu);font-size:.72em;font-weight:700;margin:.5em 0}.marker::before,.marker::after{content:'';flex:1;height:1px;background:rgba(192,132,252,.35)}
.chips{display:flex;gap:.4em;overflow-x:auto;padding:.1em 0 .5em;-ms-overflow-style:none;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips .pill{cursor:pointer;flex:0 0 auto}.chips .pill.on{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.15);color:var(--cy2)}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs></svg>
<script>
(function(){
'use strict';
/* ---------------- constants ---------------- */
const CORE='https://raw.githubusercontent.com/thealliancedao/tla-core/main/';
const DAO ='https://raw.githubusercontent.com/thealliancedao/dao-originations/main/';
const CDN ='https://imagedelivery.net/v_zOWVQCPb7Xpcbu-gQC1A/alliance_dao';
const DAOS=[['aDAO','adao','p_adao'],['Lion DAO','lion-dao','p_lion'],['Pixel Lions','pixel-lions','p_pixel']];
const TABS={home:['Today','fa-house'],portfolio:['Portfolio','fa-chart-pie'],market:['Market','fa-store'],vote:['Vote','fa-check-to-slot'],tla:['TLA','fa-chart-line'],nft:['NFTs','fa-images'],more:['More','fa-ellipsis']};
const DEFAULT_TABS=['home','portfolio','market','vote','more'];
const TLA_TOTAL_VP_FALLBACK=29.4e6;   // reconciled vs Eris (doctrine); replaced by max bucket VP when the snapshot carries it
const $=id=>document.getElementById(id);
/* ---------------- storage ---------------- */
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const prefs=()=>Object.assign({tabs:DEFAULT_TABS.slice(),dao:'all',onboarded:false},ls('ally:prefs')||{});
const setPrefs=p=>{const n=Object.assign(prefs(),p);ls('ally:prefs',n);return n};
const wallet=()=>{try{return localStorage.getItem('tla:selected_wallet')||null}catch(e){return null}};
const setWallet=w=>{try{if(w)localStorage.setItem('tla:selected_wallet',w);else localStorage.removeItem('tla:selected_wallet')}catch(e){}};
const SNAP='ally:app:snap', TL='ally:app:timeline';
/* ---------------- format ---------------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(n)=>n==null||n===''||isNaN(Number(n))?null:Number(n);
const fmt={
  usd:(n,d)=>{n=num(n);if(n==null)return'—';const a=Math.abs(n);if(a===0)return'$0';if(d==null)d=a<1?4:a<100?2:0;return (n<0?'-':'')+'$'+a.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})},
  n:(n,d=0)=>{n=num(n);return n==null?'—':n.toLocaleString(undefined,{maximumFractionDigits:d})},
  k:(n)=>{n=num(n);if(n==null)return'—';const a=Math.abs(n);return (n<0?'-':'')+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?(a/1e3).toFixed(1)+'K':a.toLocaleString(undefined,{maximumFractionDigits:a<10?2:0}))},
  pct:(n,d=1)=>{n=num(n);return n==null?'—':(n>0?'+':'')+n.toFixed(d)+'%'},
  ago:(t)=>{if(!t)return'';const s=(Date.now()-new Date(t))/1e3;if(isNaN(s))return'';if(s<60)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago'},
  until:(t)=>{if(!t)return'';const s=(new Date(t)-Date.now())/1e3;if(isNaN(s))return'';if(s<=0)return'now';if(s<3600)return Math.round(s/60)+'m';if(s<86400)return Math.round(s/3600)+'h';const d=Math.floor(s/86400),h=Math.round((s%86400)/3600);return d+'d'+(h?' '+h+'h':'')},
  date:(t)=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—',

/* ---- NFTs: ACTIVITY FEED first (what happened), then the collection ---- */
let feedMonths=2;
function activity(){
  /* one merged ledger: transfers (tla-flows aux: transfer / send_nft / list / cancel / sale) + sales (enriched) + listing history (list / delist / sold) */
  const kc=(D.known&&D.known.contracts)||{}; const isContract=a=>!!kc[a]; const nameOf=a=>kc[a]&&kc[a].name;
  const ev=[]; const push=x=>ev.push(x);
  Object.values(D.transfers||{}).forEach(arr=>(arr||[]).forEach(e=>{
    const to=nameOf(e.to)||'', from=nameOf(e.from)||''; let kind='transfer',ic='fa-right-left',cls='cy',text;
    if(e.action==='send_nft'){ if(/daodao|dao dao/i.test(to)||/stak/i.test(to)){kind='stake';ic='fa-lock';cls='pu';text=`staked to ${to}`} else if(/enterprise/i.test(to)){kind='stake';ic='fa-lock';cls='pu';text=`staked to ${to}`} else if(/bbl|backbone|atrium|boost|market/i.test(to)){kind='list';ic='fa-tag';cls='am';text=`listed on ${to.replace(/ marketplace.*/i,'')}`} else {kind='send';ic='fa-paper-plane';cls='cy';text=`sent to ${to||labelAddr(e.to)}`} }
    else if(e.action==='transfer_nft'){ if(/daodao|dao dao|stak|enterprise/i.test(from)){kind='unstake';ic='fa-lock-open';cls='or';text=`unstaked from ${from} → ${labelAddr(e.to)}`} else if(/bbl|backbone|atrium|boost|market/i.test(from)){kind='delist';ic='fa-tag';cls='mut';text=`returned from ${from.replace(/ marketplace.*/i,'')} → ${labelAddr(e.to)}`} else {text=`${labelAddr(e.from)} → ${labelAddr(e.to)}`} }
    else if(e.action==='list'){kind='list';ic='fa-tag';cls='am';text=`listed${to?' on '+to.replace(/ marketplace.*/i,''):''}`}
    else if(e.action==='cancel'){kind='delist';ic='fa-tag';cls='mut';text='delisted'}
    else if(e.action==='sale'){kind='sale';ic='fa-cart-shopping';cls='gr';text=`sold${e.to?' to '+labelAddr(e.to):''}`}
    else if(e.action==='mint'){kind='mint';ic='fa-wand-magic-sparkles';cls='gr';text=`minted by ${labelAddr(e.to)}`}
    else{text=e.action}
    push({t:e.timestamp,id:String(e.token_id),kind,ic,cls,text,who:[e.from,e.to],k:'tx:'+e.txhash+':'+e.token_id+':'+e.action});
  }));
  ((D.sales&&D.sales.sales)||[]).forEach(s=>push({t:s.timestamp,id:String(s.token_id),kind:'sale',ic:'fa-cart-shopping',cls:'gr',text:`sold on ${s.marketplace||'BBL'} for ${fmt.n(s.amount,s.amount<10?2:0)} ${s.denom_symbol||''}${num(s.notional_usd)!=null?' ('+fmt.usd(num(s.notional_usd),num(s.notional_usd)<10?2:0)+')':''}${s.buyer?' → '+labelAddr(s.buyer):''}`,who:[s.seller,s.buyer],k:'sale:'+s.tx_hash+':'+s.token_id}));
  ((D.lhist&&D.lhist.records)||[]).forEach(r=>(r.segments||[]).forEach((sg,i)=>{ if(i===0&&sg.from_ts)push({t:sg.from_ts,id:String(r.token_id),kind:'list',ic:'fa-tag',cls:'am',text:`listed on ${r.marketplace} for ${fmt.n(num(sg.price)/1e6,0)} ${/bluna/i.test(sg.denom)?'bLUNA':/uluna/.test(sg.denom)?'LUNA':/solid/i.test(sg.denom)?'SOLID':''}`,who:[r.seller],k:'lh:'+r.listing_ref+':'+r.token_id+':'+i});
    if(sg.to_ts&&sg.end_reason&&sg.end_reason!=='still_listed'&&sg.end_reason!=='sold')push({t:sg.to_ts,id:String(r.token_id),kind:'delist',ic:'fa-tag',cls:'mut',text:`delisted from ${r.marketplace} (${sg.end_reason.replace(/_/g,' ')})`,who:[r.seller],k:'lhx:'+r.listing_ref+':'+r.token_id+':'+i})}));
  /* dedupe near-identical (same token, same kind, within 2 min) */
  ev.sort((a,b)=>new Date(b.t)-new Date(a.t)); const out=[]; const last={};
  ev.forEach(e=>{if(!e.t)return;const key=e.id+'|'+e.kind;const prev=last[key];if(prev&&Math.abs(new Date(prev)-new Date(e.t))<120e3)return;last[key]=e.t;out.push(e)});
  return out;
}
