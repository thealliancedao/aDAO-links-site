  const stakers=(D.summary&&D.summary.daodao_stakers)||[]; const myStake=P?stakers.find(x=>x.address===P.w):null;
  $('dao').innerHTML=`
  <div class="grid2"><div class="tile"><div class="k">DAO value</div><div class="v xs">${fmt.usd(m.daoValue,0)}</div><div class="sub">treasury ${fmt.usd(m.treasury,0)}</div></div><div class="tile"><div class="k">Members · staked</div><div class="v xs">${fmt.n(m.members)} · ${fmt.n(m.staked)}</div><div class="sub">${myStake?'you: '+fmt.n(myStake.count)+' ('+myStake.voting_power_pct.toFixed(1)+'% of votes)':fmt.n(m.holders)+' holders'}</div></div></div>
  <div class="seg">${[['all','All'],['aDAO','aDAO'],['Lion DAO','Lion'],['Pixel Lions','Pixel']].map(([k,l])=>`<button type="button" data-dao="${k}" class="${(Pf.dao||'all')===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="sec"><span>In voting</span><span class="pill ${open.length?'pu':'mut'}">${open.length}</span></div>${open.length?open.map(card).join(''):'<div class="empty"><i class="fas fa-landmark"></i>Nothing to vote on right now.</div>'}
  ${veto.length?`<div class="sec"><span>Veto timelock</span><span class="pill am">${veto.length}</span></div>${veto.map(card).join('')}`:''}
  <div class="sec"><span>Recent</span></div>${recent.map(card).join('')||'<div class="empty">—</div>'}
  <div class="btns"><a class="btn g" href="dao.html"><i class="fas fa-landmark"></i> Governance page &amp; audits</a><a class="btn g" href="dao_treasury.html">Treasury</a><a class="btn g" href="https://daodao.zone/" target="_blank" rel="noopener">DAO DAO <i class="fas fa-arrow-up-right-from-square"></i></a></div>
  <div class="dev">proposals ${fmt.ago((D.p_adao||{}).exportedAt)} · dao-dashboard ${fmt.ago(dash.meta&&dash.meta.generatedAt||dash.capturedAt)}</div>`;
  $('dao').querySelectorAll('[data-dao]').forEach(b=>b.onclick=()=>{setPrefs({dao:b.getAttribute('data-dao')});vDao();badge()});
  $('dao').querySelectorAll('[data-prop]').forEach(c=>c.onclick=()=>{const [dao,id]=c.getAttribute('data-prop').split('|');propSheet(dao,id)});
}

/* ================= v2 · ME — wallet · totals · settings ================= */

  const rewBy={};if(P)P.rew.forEach(r=>{const k=r.reward_symbol||'?';rewBy[k]=rewBy[k]||0;rewBy[k]+=num(r.usd_value)||0});
  $('me').innerHTML=`
  ${P?`<div class="hero"><div class="lab">${esc(P.name||fmt.addr(P.w))} <span class="pill mut" style="margin-left:.3em">${P.isTla?'TLA':''}${P.isTla&&P.isAdao?' · ':''}${P.isAdao?'aDAO':''}</span></div><div class="big">${fmt.usd(P.total,0)}</div><div class="sub">locks ${fmt.usd(P.lockUsd,0)} · LPs ${fmt.usd(P.lpUsd,0)} · NFT backing ${fmt.usd(P.nftBacking,0)} · wallet ${fmt.usd(P.balUsd,0)} · claimable ${fmt.usd(P.claimable)}</div></div>
  <div class="grid2"><div class="tile"><div class="k">Voting power</div><div class="v xs">${fmt.k(P.vp)}</div><div class="sub">${P.rank?'rank #'+P.rank:''}</div></div><div class="tile"><div class="k">aDAO NFTs</div><div class="v xs">${fmt.n(P.nftCount)}</div><div class="sub">${P.staked?P.staked+' staked · ':''}${P.nftBroken?P.nftBroken+' broken':''}</div></div></div>`:''}
  <div class="card"><div class="k">Wallet</div><div class="row" style="margin-top:.3em"><div class="l k2 mono">${w?esc(fmt.addr(w)):'none selected'}</div><button class="btn g" id="m-wallet" type="button">${w?'Change':'Pick'}</button>${w?'<button class="btn g" id="m-clear" type="button">Clear</button>':''}</div></div>
  <div class="card"><div class="k">Default window</div><div class="seg" style="margin-bottom:0">${Object.keys(WINS).map(k=>`<button type="button" data-win="${k}" class="${win()===k?'on':''}">${k}</button>`).join('')}</div></div>
  <div class="card"><div class="k">Badge counts proposals in</div><div class="seg" style="margin-bottom:0">${[['all','All'],['aDAO','aDAO'],['Lion DAO','Lion'],['Pixel Lions','Pixel']].map(([k,l])=>`<button type="button" data-dao="${k}" class="${(Pf.dao||'all')===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="card"><div class="k" style="margin-bottom:.2em">Your five tabs</div>${Object.entries(TABS).map(([k,[l,ic]])=>`<label class="chk"><input type="checkbox" data-t="${k}" ${Pf.tabs.includes(k)?'checked':''}><i class="fas ${ic}" style="width:1.4em;color:#67e8f9"></i>${l}</label>`).join('')}</div>
  <div class="card"><div class="k">Housekeeping</div><div class="btns" style="margin-top:.4em"><button class="btn g" id="m-reset" type="button">Reset "since last looked"</button><button class="btn g" id="m-ob" type="button">Show the intro again</button></div></div>
  <div class="sec"><span>Help</span></div><div class="list"><a class="li tap" href="install.html"><span class="ic cy"><i class="fas fa-mobile-screen"></i></span><div class="l"><div class="t">Add Ally to your home screen</div><div class="s">iPhone, Android, desktop</div></div></a><a class="li tap" href="help.html"><span class="ic cy"><i class="fas fa-circle-question"></i></span><div class="l"><div class="t">Help &amp; FAQ</div></div></a><a class="li tap" href="new-here.html"><span class="ic am"><i class="fas fa-seedling"></i></span><div class="l"><div class="t">New to aDAO?</div></div></a><a class="li tap" href="new-here-tla.html"><span class="ic or"><i class="fas fa-seedling"></i></span><div class="l"><div class="t">New to TLA?</div></div></a><a class="li tap" href="index.html"><span class="ic cy"><i class="fas fa-globe"></i></span><div class="l"><div class="t">Open the full site</div></div></a></div>
  <div class="dev">Ally ${REV} · read-only · nothing leaves your phone · <a href="transparency-hub.html" style="color:#67e8f9">how the data is captured</a></div>`;
  $('m-wallet').onclick=openPicker; const cl=$('m-clear'); if(cl)cl.onclick=()=>{setWallet(null);paintTop();vMe();toast('Wallet cleared')};
  $('me').querySelectorAll('[data-dao]').forEach(b=>b.onclick=()=>{setPrefs({dao:b.getAttribute('data-dao')});vMe();badge()});
  $('me').querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{setPrefs({win:b.getAttribute('data-win')});vMe()});
  $('me').querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{const on=[...$('me').querySelectorAll('[data-t]:checked')].map(x=>x.getAttribute('data-t'));if(on.length>5){c.checked=false;toast('Five max');return}if(on.length<1){c.checked=true;return}setPrefs({tabs:on});paintTabs();document.querySelector('.tab[data-v="me"]')?.classList.add('on')});
  $('m-reset').onclick=()=>{ls(SNAP,null);toast('Reset — next open is a first look')}; $('m-ob').onclick=()=>onboarding();
}
try{window.__ally={D,model,me,todayRows,prefs,setPrefs,setWallet,show,activity,loadWindow,loadNfts,PAST,win}}catch(e){}
VIEWS={today:vToday,nfts:vNfts,tla:vTla,dao:vDao,me:vMe,vote:vVote,market:vMarket,portfolio:vPortfolio};
/* ---- boot ---- */
(async()=>{
  try{if(/[?&]source=pwa/.test(location.search)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches))setPrefs({mode:'app'})}catch(e){}
  const pr=$('page-rev');if(pr)pr.textContent='Ally app '+REV+' · '+REV_DATE;
  paintTabs(); const g=$('gear'); if(g)g.onclick=()=>show('me');
  try{await load()}catch(e){}
  try{await loadWindow()}catch(e){}
  paintTop(); record(me(),model());
  const v=(location.hash||'#today').slice(1); show(VIEWS[v]?v:'today');
  if(!prefs().onboarded)onboarding();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{})}catch(e){}}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&D._at&&Date.now()-new Date(D._at)>10*60e3)refreshAll()});
})();
})();
