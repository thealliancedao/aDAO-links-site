<!DOCTYPE html>
<html lang="en" data-tenant="liondao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- liondao/ecosystem.html 2.0 (2026-09-26) — THE LION DAO ECOSYSTEM MAP (owner 2026-09-25: "Lion DAO at the center … ROAR, core DAO
         holdings and overall value … then side projects with the same type of data for Pixel Lions, pyROAR, ROAR20 and BL … laid out like the
         new-here tab, a big-picture view"). Lion DAO sits in the middle with ROAR; the four projects sit around it, each with the same five
         lines (what it is · its price or floor · how many there are · who holds them · where to go), and each line from the centre says how
         the project ties to Lion DAO. Below the map: what Lion DAO owns, the page for every question, and every address the registry knows.
         Numbers come from the same loader and derive() as the home (lib/home-tiles.js 1.6.0), so the map and the home never disagree. -->
    <base href="/">
    <title>Lion DAO ecosystem | thealliancedao.com</title>
    <link rel="icon" type="image/png" href="/assets/token-logos/ROAR_LOGO.png">
    <meta name="description" content="The Lion DAO ecosystem on one map: Lion DAO and ROAR at the centre, pixeLions, pyROAR, ROAR20 and the Burning Lions around it.">
    <meta name="theme-color" content="#0b0b0b">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>:root { --t-accent: #ffe600; --t-accent2: #f59e0b; --t-bg: #0b0b0b; --t-surface: #161616; --t-surface2: #101010; --t-text: #e5e7eb; --t-border: #4a4000; --t-font: 'Press Start 2P', Inter, sans-serif; } html, body { background: var(--t-bg) !important; }
        .em { position: relative; display: grid; grid-template-columns: 1fr 1.25fr 1fr; grid-template-rows: auto auto; gap: 2.2rem 3rem; align-items: stretch; margin: .5rem 0 2.5rem }
        .em-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible }
        .em-node { position: relative; z-index: 1; background: linear-gradient(180deg,#1a1a1a,#121212); border: 1px solid #2a2a2a; border-radius: 16px; padding: 1rem 1.1rem 1.1rem; text-decoration: none; color: inherit; display: block; transition: border-color .15s, transform .15s }
        .em-node:hover { border-color: var(--t-accent); transform: translateY(-2px) }
        .em-core { grid-column: 2; grid-row: 1 / span 2; align-self: center; border: 2px solid var(--t-accent); box-shadow: 0 0 0 6px rgba(255,230,0,.06), 0 20px 60px -30px rgba(255,230,0,.55); padding: 1.4rem 1.4rem 1.3rem; background: radial-gradient(120% 90% at 50% 0%, rgba(255,230,0,.12), transparent 60%), #141414 }
        .em-pl { grid-column: 1; grid-row: 1 } .em-py { grid-column: 3; grid-row: 1 } .em-r20 { grid-column: 1; grid-row: 2 } .em-bl { grid-column: 3; grid-row: 2 }
        .em-h { display: flex; align-items: center; gap: .55rem; font-weight: 800; color: #fff; font-size: 1.05rem } .em-h img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover } .em-h small { margin-left: auto; font-weight: 600; font-size: .66rem; color: #9ca3af; text-transform: uppercase; letter-spacing: .06em }
        .em-core .em-h { font-size: 1.35rem; justify-content: center } .em-core .em-h img { width: 44px; height: 44px }
        .em-what { font-size: .8rem; color: #9ca3af; margin: .35rem 0 .7rem; line-height: 1.45 } .em-core .em-what { text-align: center }
        .em-big { font-size: 1.6rem; font-weight: 800; color: var(--t-accent); font-variant-numeric: tabular-nums; line-height: 1.1 } .em-core .em-big { font-size: 2.3rem; text-align: center }
        .em-big small { font-size: .5em; color: #9ca3af; font-weight: 600; margin-left: .35rem }
        .em-kv { display: grid; grid-template-columns: 1fr auto; gap: .28rem .8rem; margin-top: .75rem; font-size: .82rem } .em-kv dt { color: #9ca3af } .em-kv dd { margin: 0; color: #fff; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums }
        .em-tie { margin-top: .75rem; font-size: .74rem; color: var(--t-accent); border-top: 1px dashed #333; padding-top: .55rem; line-height: 1.45 }
        .em-go { position: absolute; right: .9rem; bottom: .7rem; font-size: .7rem; color: #6b7280 }
        .em-core .em-kv { grid-template-columns: repeat(2, 1fr auto) }
        @media (max-width: 1000px) { .em { grid-template-columns: 1fr 1fr; gap: 1rem } .em-core { grid-column: 1 / span 2; grid-row: 1 } .em-pl { grid-column: 1; grid-row: 2 } .em-py { grid-column: 2; grid-row: 2 } .em-r20 { grid-column: 1; grid-row: 3 } .em-bl { grid-column: 2; grid-row: 3 } .em-svg { display: none } }
        @media (max-width: 640px) { .em { grid-template-columns: 1fr } .em-core, .em-pl, .em-py, .em-r20, .em-bl { grid-column: 1; grid-row: auto } .em-core .em-kv { grid-template-columns: 1fr auto } }
        .em-q { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: .6rem }
        .em-q a { display: block; padding: .7rem .9rem; border: 1px solid #262626; border-radius: 12px; text-decoration: none; background: #141414 } .em-q a:hover { border-color: var(--t-accent) }
        .em-q b { display: block; color: #fff; font-size: .88rem } .em-q span { font-size: .75rem; color: #9ca3af }
    </style>
</head>
<body>
    <div id="site-header"></div>
    <script src="/lib/collection-context.js"></script>
    <script src="/lib/site-header.js"></script>
    <script src="/liondao/lib/ld.js?v=1.3.0"></script>
    <script src="/lib/home-tiles.js?v=1.6.1"></script>

    <main class="ld" id="page">
        <div id="crumb"></div>
        <div id="intro"></div>
        <div id="map"></div>
        <div id="owns"></div>
        <div id="where"></div>
        <div id="addresses"></div>
        <div id="about"></div>
    </main>

    <div id="site-footer"></div>
    <script src="/lib/cron-registry.js"></script>
    <script src="/lib/site-footer.js"></script>
    <script>
    (async function () {
        const REV = '2.0', REV_DATE = '2026-09-26';
        const { fmt, ui, esc, isNum, sum } = LD;
        await LD.mount({ page: 'liondao-ecosystem', rev: REV, revDate: REV_DATE });
        const ctx = LD._M.ctx || { tenant: { slug: 'liondao' }, tenants: {}, collections: [], primary: null }; const T = LD._M.tenant || {};
        const $ = (id) => document.getElementById(id);
        $('crumb').innerHTML = ui.crumb([{ label: T.label || 'Lion DAO', href: '/liondao/' }, { label: 'Ecosystem' }]);
        const cfg = await LD.jsonFetch('/liondao/home.json'); if (!cfg) { $('intro').innerHTML = ui.note('liondao/home.json did not load.'); return; }
        $('intro').innerHTML = ui.section('The Lion DAO ecosystem', 'the big picture on one map · every card opens the page with the full story', '');
        const v = (x, f, why) => x == null ? ui.unk(why || 'not read yet') : esc((f || String)(x));
        const node = (cls, o) => '<a class="em-node ' + cls + '" href="' + esc(o.href) + '" data-node="' + cls + '"><div class="em-h">' + (o.logo ? '<img src="' + esc(o.logo) + '" alt="" onerror="this.remove()">' : '') + esc(o.title) + (o.tag ? '<small>' + esc(o.tag) + '</small>' : '') + '</div><div class="em-what">' + o.what + '</div><div class="em-big">' + o.big + '</div><dl class="em-kv">' + o.kv.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl>' + (o.tie ? '<div class="em-tie">' + o.tie + '</div>' : '') + '<span class="em-go">opens →</span></a>';
        const drawLines = () => { const box = document.querySelector('.em'); const svg = document.querySelector('.em-svg'); if (!box || !svg) return; const B = box.getBoundingClientRect(); const core = box.querySelector('[data-node="em-core"]'); if (!core) return; const C = core.getBoundingClientRect(); const cx = C.left + C.width / 2 - B.left, cy = C.top + C.height / 2 - B.top;
            svg.setAttribute('viewBox', '0 0 ' + B.width + ' ' + B.height); svg.innerHTML = ['em-pl', 'em-py', 'em-r20', 'em-bl'].map(k => { const n = box.querySelector('[data-node="' + k + '"]'); if (!n) return ''; const R = n.getBoundingClientRect(); const nx = R.left + R.width / 2 - B.left, ny = R.top + R.height / 2 - B.top; return '<line x1="' + cx + '" y1="' + cy + '" x2="' + nx + '" y2="' + ny + '" stroke="#ffe600" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 6"/><circle cx="' + nx + '" cy="' + ny + '" r="3" fill="#ffe600" fill-opacity=".5"/>'; }).join(''); };
        window.addEventListener('resize', () => { clearTimeout(window.__emT); window.__emT = setTimeout(drawLines, 120); });

        const paint = (D) => {
            const R = D.roar || {}, P = D.pl || {}, Y = D.pyroar || {}, Z = D.roar20 || {}, BL = D.bl || {}, TT = D.total || {}, PR = D.pl_rewards || {};
            const mcap = isNum(R.total_supply) && isNum(R.price_usd) ? R.total_supply * R.price_usd : null;
            const core = node('em-core', { title: T.label || 'Lion DAO', logo: T.logo || '/assets/token-logos/ROAR_LOGO.png', href: '/liondao/dao_treasury.html',
                what: 'The DAO at the centre: it runs ROAR, keeps the treasury, stakes in TLA, runs a validator — and every project around it ties back here.',
                big: v(TT.known_usd, fmt.usd, 'positions product not loaded') + '<small>known value</small>',
                kv: [['ROAR', v(R.price_usd, fmt.price) + (isNum(R.chg_24h_pct) ? ' <span style="color:' + (R.chg_24h_pct >= 0 ? '#4ade80' : '#f87171') + '">' + esc(fmt.pct(R.chg_24h_pct)) + '</span>' : '')], ['ROAR market cap', v(mcap, fmt.usd, 'supply or price not read')],
                    ['Treasury ROAR', v(R.treasury_balance, fmt.big)], ['Treasury ROAR value', v(R.treasury_usd, fmt.usd)],
                    ['Staked in the DAO', v(R.staked_daodao, fmt.big, 'staking module not read') + (isNum(R.staked_pct) ? ' <span style="color:#9ca3af">' + esc(fmt.pctPlain(R.staked_pct, 0)) + '</span>' : '')], ['Burned for good', v(R.burned, fmt.big)],
                    ['TLA positions', v(D.tla && D.tla.total_usd, fmt.usd)], ['Validator', isNum(D.validator && D.validator.rank) ? '#' + esc(fmt.int(D.validator.rank)) + ' of ' + esc(fmt.int(D.validator.of)) : ui.unk('validator set not read')]],
                tie: 'ROAR is the token · staking it is the vote · the treasury, TLA positions, Credia and the validator are what the DAO owns' });
            const pl = node('em-pl', { title: 'pixeLions', tag: 'NFT · 5,000', logo: '/assets/images/pixelions-pfp.webp', href: '/nft-explorer-index.html?tenant=liondao',
                what: 'The pride\'s pixel-art collection — the Pixel Lions DAO\'s membership.', big: v(P.floor_usd, fmt.usd, 'no floor today') + '<small>floor</small>',
                kv: [['Floor × minted', v(P.market_cap_usd, fmt.usd)], ['Holders', v(P.holders, fmt.int)], ['Staked', v(P.staked_total, fmt.int) + (isNum(P.staked_pct) ? ' <span style="color:#9ca3af">' + esc(fmt.pctPlain(P.staked_pct, 0)) + '</span>' : '')], ['One-of-ones', '5 · see Rarity']],
                tie: 'Staked lions earn ROAR from Lion DAO — ' + (isNum(PR.roar_per_lion_per_hour) ? esc(fmt.num(PR.roar_per_lion_per_hour)) + ' ROAR a lion an hour' : 'the rate lands with the positions product') });
            const py = node('em-py', { title: 'pyROAR', tag: 'burn token', logo: '/assets/token-logos/pyROAR_LOGO.png', href: '/liondao/burn.html',
                what: 'Minted 1:1 for every ROAR burned in the Burning Lion Festival — to burners for their own burns, and to ROAR stakers for Lion DAO\'s.', big: v(Y.total_supply, fmt.big, 'pyROAR supply not read') + '<small>ROAR burned in the festival</small>',
                kv: [['Price', v(Y.price_usd, fmt.price, Y.price_reason)], ['Holders', v(Y.holder_count, fmt.int)], ['Largest holder', v(Y.top1_pct, (x) => fmt.pctPlain(x, 1))], ['Community sent · DAO burned', v(D.burn && D.burn.reported_community, fmt.big) + ' · ' + v(D.burn && D.burn.reported_dao, fmt.big)]],
                tie: 'Every ROAR the community sent to the burn, Lion DAO burned 10x from its treasury (up to 8B a month) — and the burners were raffled the Burning Lions' });
            const r20 = node('em-r20', { title: 'ROAR20', tag: 'Solana', href: '/liondao/roar20.html',
                what: 'Lion DAO\'s official memecoin on Solana — the pride outside Terra.', big: v(Z.price_usd, fmt.price, 'DexScreener did not answer') + (isNum(Z.chg_24h_pct) ? '<small style="color:' + (Z.chg_24h_pct >= 0 ? '#4ade80' : '#f87171') + '">' + esc(fmt.pct(Z.chg_24h_pct)) + ' 24h</small>' : ''),
                kv: [['Market cap', v(Z.market_cap_usd, fmt.usd, 'DexScreener did not answer')], ['Volume 24h', v(Z.volume_24h_usd, fmt.usd, 'DexScreener did not answer')], ['Holders', v(Z.holders, fmt.int, Z.holders_reason)], ['Supply', v(Z.supply, fmt.big)]],
                tie: 'A separate token on another chain — not ROAR, not bridged; it carries the Lion DAO name' });
            const bl = node('em-bl', { title: 'Burning Lions', tag: 'NFT · 1 of 1', href: '/liondao/mint.html#burning-lions',
                what: 'Twelve one-of-ones, raffled each month to the festival\'s burners — weighted by what they burned.', big: v(BL.supply_text, String, 'the contract did not answer') + '<small>on the contract</small>',
                kv: [['Floor', ui.unk(BL.market_reason)], ['Stated count', v(BL.planned, fmt.int)], ['Contract', '<code style="font-size:.8em">' + esc(fmt.short(BL.contract || '')) + '</code>']],
                tie: 'Won in the burn raffle — who holds each today, on NFT Mint History' });
            $('map').innerHTML = '<div class="em"><svg class="em-svg" aria-hidden="true"></svg>' + pl + core + py + r20 + bl + '</div>';
            requestAnimationFrame(drawLines);

            const parts = TT.parts || [];
            $('owns').innerHTML = ui.section('What Lion DAO owns', 'the known parts of its value · the positions product, hourly',
                '<div class="ld-tile">' + ui.table([{ label: 'Part' }, { label: 'USD', r: true }, { label: 'share', r: true }], parts.map(p => '<tr><td>' + esc(p.label) + '</td>' + ui.td(p.usd == null ? ui.unk(p.note || 'not read') : '<b class="ld-num">' + esc(fmt.usd(p.usd)) + '</b>', true) + ui.td(isNum(p.usd) && isNum(TT.known_usd) && TT.known_usd ? esc(fmt.pctPlain(p.usd / TT.known_usd * 100, 1)) : '', true) + '</tr>')) +
                '<div class="ld-src" style="margin-top:.5rem">Every wallet and every holding: <a href="/liondao/dao_treasury.html" style="color:var(--t-accent)">the treasury page →</a></div></div>');
        };
        const Q = [['Where does every ROAR sit, and who holds the vote?', '/liondao/supply.html', 'ROAR supply'], ['Who holds the most ROAR, everywhere it can sit?', '/liondao/supply.html#holders', 'ROAR supply · every wallet'],
            ['What does Lion DAO own, wallet by wallet?', '/liondao/dao_treasury.html', 'Treasury'], ['What does Lion DAO have in TLA?', '/liondao/dao_tla_deposits.html', 'TLA positions'], ['What can the DAO claim right now?', '/liondao/dao_unclaimed.html', 'Unclaimed rewards'],
            ['How is the validator doing?', '/liondao/validator.html', 'Validator'], ['Who burned the most ROAR?', '/liondao/burn.html', 'Burn leaderboard'], ['Who holds ROAR20?', '/liondao/roar20.html', 'ROAR20'],
            ['How rare is my pixeLion?', '/liondao/rarity.html', 'Pixel Lions Rarity'], ['How did the mints go — pixeLions and Burning Lions?', '/liondao/mint.html', 'NFT Mint History'], ['What did Lion DAO and aDAO build together?', '/liondao/alliance.html', 'Alliance with aDAO'], ['Every pixeLion, filterable', '/nft-explorer-index.html?tenant=liondao', 'NFT Explorer']];
        $('where').innerHTML = ui.section('Where to find it', 'one question, one page', '<div class="em-q">' + Q.map(q => '<a href="' + esc(q[1]) + '"><b>' + esc(q[0]) + '</b><span>' + esc(q[2]) + ' →</span></a>').join('') + '</div>');
        // every address the registry knows for this tenant
        (function () { var A = []; var W = T.wallets || {}; Object.keys(W).forEach(function (w) { A.push({ group: 'Roster', label: W[w].label, role: W[w].counts_as || W[w].role || '', addr: w }); });
            if (T.validator) { if (T.validator.operator) A.push({ group: 'Validator', label: 'operator', addr: T.validator.operator }); if (T.validator.account) A.push({ group: 'Validator', label: 'account (commission accrues here)', addr: T.validator.account }); }
            var ST = T.staking || {}; var LBL = T.staking_labels || {}; Object.keys(ST).forEach(function (k) { if (/^terra1/.test(String(ST[k]))) A.push({ group: 'Contracts', label: LBL[k] || k.replace(/_/g, ' '), addr: ST[k] }); });
            if (T.burn) { if (T.burn.pyroar_cw20) A.push({ group: 'The burn', label: 'pyROAR (Burnt ROAR) cw20', addr: T.burn.pyroar_cw20 }); if (T.burn.pyroar_pair) A.push({ group: 'The burn', label: 'pyROAR pair', addr: T.burn.pyroar_pair }); if (T.burn.festival_receiver) A.push({ group: 'The burn', label: 'festival receiver (Enterprise core)', addr: T.burn.festival_receiver }); }
            (T.roar_pools || []).forEach(function (p) { if (p.address) A.push({ group: 'Pools', label: p.label + ' pair', addr: p.address }); });
            if (T.burning_lions && T.burning_lions.contract) A.push({ group: 'Collections', label: 'Burning Lions cw721', addr: T.burning_lions.contract });
            (ctx.collections || []).forEach(function (c) { if (c.contract) A.push({ group: 'Collections', label: (c.label || c.slug) + ' cw721', addr: c.contract }); if (c.manifest && c.manifest.governance && c.manifest.governance.dao_address) A.push({ group: 'Collections', label: (c.manifest.governance.dao_name || 'DAO') + ' — DAODAO core', addr: c.manifest.governance.dao_address }); });
            if (T.roar20 && T.roar20.mint) A.push({ group: 'Solana', label: 'ROAR20 mint', addr: T.roar20.mint, chain: 'solana' });
            var seen = {}; A = A.filter(function (x) { if (seen[x.addr]) return false; seen[x.addr] = true; return true; }); var groups = []; A.forEach(function (x) { if (groups.indexOf(x.group) === -1) groups.push(x.group); });
            $('addresses').innerHTML = ui.section('Every address', A.length + ' from the registry · copy, search the site, or open the explorer', ui.details('Show every address', '<div class="ld-tile">' + groups.map(function (g) { return '<div class="ld-k" style="margin-top:.5rem">' + esc(g) + '</div>' + ui.table([{ label: 'What' }, { label: 'Address' }], A.filter(function (x) { return x.group === g; }).map(function (x) { return '<tr><td>' + esc(x.label) + (x.role ? ' <span class="ld-sub">' + esc(x.role) + '</span>' : '') + '</td><td>' + ui.addr(x.addr, { full: true, chain: x.chain }) + '</td></tr>'; })); }).join('') + '</div>')); })();
        $('about').innerHTML = ui.section('How this page is built', '', ui.note('The same loader and derive() as the home (<b>lib/home-tiles.js</b>): Lion DAO\'s known value and holdings from the positions product (hourly), ROAR from its contract and the TLA pool price, staking from the DAODAO module, pixeLions from the collection snapshots, pyROAR from the burn ledger and its pair, ROAR20 from DexScreener (theirs, labeled) and the holder walk, the Burning Lions from their contract. A number with no source says why instead of guessing.'));
        const paintAll = () => paint(HomeTiles.derive(loader.sources, cfg, ctx));
        const loader = HomeTiles.load(cfg, ctx, () => { clearTimeout(window.__ldT); window.__ldT = setTimeout(paintAll, 150); }); paintAll(); await loader.all; paintAll();
    })().catch(e => { document.getElementById('intro').innerHTML = '<div class="ld-note">The page hit an error: ' + LD.esc(e && e.message) + '</div>'; console.error(e); });
    </script>
</body>
</html>
