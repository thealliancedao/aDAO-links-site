<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Atrium favicon — gold ◆ diamond glyph on cathedral-cosmic background.
    Matches the brand-identity used in components/AtriumLaunchBanner +
    the AtriumBackdrop palette. Served at atrium.markets via
    pages/_app.tsx host-aware <link rel="icon">.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c0f2c"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdb8a"/>
      <stop offset="50%" stop-color="#e8a850"/>
      <stop offset="100%" stop-color="#ff8a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdb8a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ff8a3c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background void disc -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Ember halo -->
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- Diamond ◆ — geometric, slightly elongated vertically for elegance -->
  <path d="M 32 8 L 50 32 L 32 56 L 14 32 Z"
        fill="url(#diamond)"
        stroke="#ffdb8a"
        stroke-width="0.5"
        stroke-opacity="0.4"/>

  <!-- Inner facet highlight (top-left) -->
  <path d="M 32 8 L 50 32 L 32 32 Z"
        fill="#ffdb8a"
        fill-opacity="0.22"/>

  <!-- Center spark -->
  <circle cx="32" cy="32" r="2" fill="#fff8e0" fill-opacity="0.85"/>
</svg>
